# Home/LAN resolver: Unbound forwarding every query to NextDNS over DNS-over-TLS.
# Profile: e96e52. Replace the profile ID and the linked IP if NextDNS changes them.
# Bind to LAN address(es) only; never expose port 53 to the internet.
server:
    interface: 127.0.0.1
    interface: 192.168.0.170          # server LAN IP (wlan0)
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/24 allow
    access-control: 0.0.0.0/0 refuse
    do-not-query-localhost: no
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes

forward-zone:
    name: "."
    forward-tls-upstream: yes
    # NextDNS DoT endpoint (port 853, SNI e96e52.dns.nextdns.io)
    forward-addr: 45.90.28.207@853#e96e52.dns.nextdns.io
    forward-addr: 45.90.30.207@853#e96e52.dns.nextdns.io
